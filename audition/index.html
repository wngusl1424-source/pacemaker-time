<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오디션 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오디션 노트">
<meta name="theme-color" content="#ffffff">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 콜시트처럼 위에서 아래로 훑는 한 줄짜리 행 목록. 상단 탭, 왼쪽엔 날짜/상태, 가운데 작품, 오른쪽 버튼. */
:root {
  --bg: #f4f6f4;
  --paper: #ffffff;
  --ink: #18221d;
  --muted: #5d6b64;
  --line: #dde3df;
  --accent: #356854;      /* 시트 헤더의 초록 */
  --accent-soft: #e3eee8;
  --accent-ink: #ffffff;
  --warn: #b5541c;
  --warn-soft: #fbeadf;
  --done: #2d6a8a;
  --done-soft: #e2eef4;
  --off: #7a817d;
  --off-soft: #eceeed;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --paper: #18201c; --ink: #e6ece8; --muted: #9aa8a0; --line: #2a3530;
    --accent: #6fb092; --accent-soft: #1f3129; --accent-ink: #0f1712;
    --warn: #f0995f; --warn-soft: #3a2519; --done: #7fbad6; --done-soft: #1b2b33;
    --off: #8d958f; --off-soft: #222a26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --paper: #18201c; --ink: #e6ece8; --muted: #9aa8a0; --line: #2a3530;
  --accent: #6fb092; --accent-soft: #1f3129; --accent-ink: #0f1712;
  --warn: #f0995f; --warn-soft: #3a2519; --done: #7fbad6; --done-soft: #1b2b33;
  --off: #8d958f; --off-soft: #222a26; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: 22px; margin: 0; letter-spacing: -0.01em; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 8px 12px 10px; border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }
nav.tabs a .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
main { padding-block: 20px 60px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); color: var(--ink); font: inherit; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; border-color: var(--warn); color: var(--warn); }
.btn.danger.armed { background: var(--warn); color: var(--paper); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 마감 임박 띠 */
.due { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; }
.due h2 { font-size: 13px; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.due-list { display: flex; gap: 8px; flex-wrap: wrap; }
.due-item { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); cursor: pointer; font: inherit; color: var(--ink); text-align: left; min-width: 0; }
.due-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.empty-due { color: var(--muted); font-size: 14px; }

.group-h { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 8px; }
.group-h h3 { font-family: var(--font-display); font-size: 17px; margin: 0; }
.group-h .n { font-family: var(--font-mono); color: var(--muted); font-size: 13px; }

/* 행 목록 */
.rows { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; align-items: start; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.when { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.date { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); }
.date.dim { color: var(--muted); }
.body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.meta span { overflow-wrap: anywhere; }
.role { font-size: 13.5px; color: var(--ink); opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.side { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.open { font-size: 13px; color: var(--accent); text-decoration: none; white-space: nowrap; font-weight: 500; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.todo { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--done-soft); color: var(--done); }
.pill.off { background: var(--off-soft); color: var(--off); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.dday { font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); }
.dday.soon { background: var(--warn); color: var(--paper); }
.dday.past { background: var(--off-soft); color: var(--off); }
.note { font-size: 12.5px; color: var(--muted); }

/* 투어: 날짜별 묶음 */
.tour-row { grid-template-columns: 80px minmax(0, 1fr) auto; }
.time { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.row.tour-noTime { grid-template-columns: minmax(0, 1fr) auto; }

/* 에이전시 카드 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card .name { font-weight: 600; font-size: 16px; }
.kv { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.copy { border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0 0 0 6px; }

/* 상태 메시지 */
.state { background: var(--paper); border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px 20px; text-align: center; color: var(--muted); }
.state strong { color: var(--ink); display: block; margin-bottom: 6px; font-size: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }

/* 편집 패널 */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 13, .45); z-index: 20; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--paper); z-index: 21; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.18); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.panel-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); gap: 12px; }
.panel-h h2 { font-family: var(--font-display); font-size: 19px; margin: 0; }
.x { border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1; padding: 4px 8px; }
.panel-b { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.panel-f { display: flex; gap: 8px; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.paste { border: 1px dashed var(--accent); border-radius: var(--radius); padding: 12px 14px; background: var(--accent-soft); font-size: 13.5px; color: var(--ink); }
.paste textarea { margin-top: 8px; width: 100%; min-height: 44px; font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); resize: vertical; }

/* 표 보기 (시트처럼 한 건당 한 줄) */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tbl-wrap { overflow: auto; max-height: calc(100vh - 220px); min-height: 240px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.tbl { border-collapse: separate; border-spacing: 0; font-size: 13.5px; width: max-content; min-width: 100%; }
.tbl th { position: sticky; top: 0; z-index: 1; background: var(--accent); color: var(--accent-ink); text-align: left; font-weight: 600; padding: 8px 10px; white-space: nowrap; cursor: pointer; user-select: none; }
.tbl th .arr { font-family: var(--font-mono); font-size: 11px; margin-left: 4px; opacity: .85; }
.tbl td { padding: 7px 10px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top; max-width: var(--w, 180px); }
.tbl tbody tr:nth-child(even) td { background: var(--bg); }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--accent-soft); }
.tbl td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tbl.wrap-on td { white-space: pre-line; }

@media (max-width: 640px) {
  .row, .tour-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .when { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px; }
  .side { flex-direction: row; align-items: center; justify-content: flex-start; }
  .pair { grid-template-columns: 1fr; }
}
/* ---- 앱 전용 ---- */
.shortcuts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.sc-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.sc { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--paper); color: var(--ink); text-decoration: none; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.sc:hover { border-color: var(--accent); }
.sc.edit { color: var(--muted); border-style: dashed; }
.subtabs { display: flex; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; width: fit-content; max-width: 100%; margin-bottom: 14px; background: var(--paper); }
.subtabs a { padding: 8px 16px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; }
.subtabs a[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.subtabs .n { margin-left: 6px; font-family: var(--font-mono); font-size: 12px; }
.sum { font-size: 13.5px; }
.chips2 { display: flex; gap: 4px; flex-wrap: wrap; }
.chips2 span { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--off-soft); color: var(--ink); }
html, body { margin: 0; }
body { padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
button { font: inherit; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync.err { color: var(--warn); }
.icon-btn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: var(--radius); padding: 8px 11px; cursor: pointer; line-height: 1; }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ai { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.spark { color: #e2b13c; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kakao { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: #fee500; color: #191919; white-space: nowrap; }
.kakao.sm { padding: 3px 8px; font-size: 12px; }
.addr { font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
.addr.missing { color: var(--warn); }
.pm { font-size: 12px; color: var(--done); }
.post-row { grid-template-columns: 112px minmax(0, 1fr) auto; }
.post-row .side { align-items: stretch; min-width: 128px; }
.post-row .side .btn, .post-row .side .kakao { justify-content: center; text-align: center; }
.dim-row { opacity: .62; }
.modal-b { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); background: var(--bg); }
.drop.on { border-color: var(--accent); background: var(--accent-soft); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb button { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 22px; padding: 0; }
.wait { display: flex; gap: 8px; align-items: center; color: var(--muted); padding: 10px 0; }
.spin { display: inline-block; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.reply { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.cand { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.cand:first-child { border-top: 0; }
.cand input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.cand .addr-in { margin-top: 6px; width: 100%; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.opt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.opt select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.err { color: var(--warn); font-size: 13.5px; margin: 0; }
.plan-day { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.plan-day h4 { margin: 0; padding: 10px 14px; background: var(--accent); color: var(--accent-ink); font-size: 14.5px; }
.stop { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.stop:first-of-type { border-top: 0; }
.stop .no { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; }
.move { font-size: 12.5px; color: var(--muted); }
.setup { max-width: 560px; margin: 24px auto; }
.setup textarea { width: 100%; min-height: 80px; font: inherit; font-size: 13px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); margin: 10px 0; }
.mlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.mitem { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: var(--paper); color: var(--ink); text-align: left; text-decoration: none; cursor: pointer; font-size: 14.5px; }
.mitem:first-child { border-top: 0; }
@media (max-width: 640px) {
  .post-row { grid-template-columns: minmax(0, 1fr); }
  .post-row .side { flex-direction: row; flex-wrap: wrap; min-width: 0; }
  .top-row h1 { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1>오디션 노트</h1>
      <div class="top-actions">
        <span class="sync" id="sync" role="status"></span>
        <button class="btn" id="addBtn" type="button">+ 새로 추가</button>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="메뉴">⋯</button>
      </div>
    </div>
    <nav class="tabs" aria-label="보기">
      <a href="#online" data-view="calls" id="callsTab">새로운 캐스팅콜<span class="n" id="n-calls"></span></a>
      <a href="#auditions" data-view="auditions">지원 현황<span class="n" id="n-auditions"></span></a>
      <a href="#tour" data-view="tour">다녀온 투어<span class="n" id="n-tour"></span></a>
      <a href="#agency" data-view="agency">에이전시<span class="n" id="n-agency"></span></a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <div class="state"><strong>기록을 불러오는 중이에요</strong>오디션 지원 현황, 프로필 투어, 에이전시 기록이 여기에 나타나요.</div>
</main>

<div id="layer"></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  /* ---------- 날짜 ---------- */
  function todayISO() {
    const d = new Date(Date.now() + 9 * 3600e3); // 한국 시간 기준
    return d.toISOString().slice(0, 10);
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);

  const DEFAULT_SORT = { auditions: ['order', 'desc'], tours: ['no', 'asc'], meetings: ['no', 'asc'], agencies: ['order', 'asc'] };
  function sortRows(coll, rows) {

      const x = a[k], y = b[k];

      if (ex !== ey) return ex ? 1 : -1; // 빈칸은 항상 아래로
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * sgn;

        .filter(x => x[1]).map(([k, v]) => '<dt>' + k + '</dt><dd>' + esc(v) + (k === '이메일' ? '<button type="button" class="copy" data-copy="' + esc(String(v).split(/\s/)[0]) + '">복사</button>' : '') + '</dd>').join('');
      return '<div class="card" data-edit="agencies:' + esc(r.id) + '" tabindex="0"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><span class="name">' + esc(r.name) + '</span>'

  function emptyState(t, s) { return '<div class="state"><strong>' + esc(t) + '</strong>' + esc(s) + '</div>'; }

  /* ---------- 렌더 ---------- */
  function render() {

    if (state.view === 'auditions') main.insertAdjacentHTML('beforeend', bookmarkBoxHTML());
    if (state.dbState === 'slow') main.insertAdjacentHTML('afterbegin', '<div class="note" style="margin-bottom:10px">저장소 연결이 늦어지고 있어요. 보이는 내용이 최신이 아닐 수 있어요.</div>');

  /* ---------- 편집 패널 ---------- */
  let panelArmed = false;
  function openPanel(coll, id, preset) {
    const schema = SCHEMA[coll];
    const rec = id ? state.data[coll].find(r => r.id === id) : null;

      if (coll === 'tours') { v.dateISO ||= todayISO(); v.type ||= '작품 (영화)'; }
      if (coll === 'meetings') { v.dateISO ||= todayISO(); }
      if (coll === 'postings') { v.status ||= '예정'; v.type ||= '작품 (영화)'; v.pmWeek = mondayOf(todayISO()); }
    }
    const fieldHTML = f => {
      if (f.newOnly && rec) return '';
      const val = v[f.k] ?? '';

      else if (f.type === 'select') input = '<select id="' + id + '" name="' + f.k + '">' + f.opts.map(o => '<option' + (o === val ? ' selected' : '') + ' value="' + esc(o) + '">' + esc(o || '—') + '</option>').join('') + '</select>';
      else if (f.type === 'textarea') input = '<textarea id="' + id + '" name="' + f.k + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>' + esc(val) + '</textarea>';
      else input = '<input id="' + id + '" name="' + f.k + '" type="' + (f.type || 'text') + '" value="' + esc(val) + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + (f.list ? ' list="' + f.list + '" autocomplete="off"' : '') + '>';
      if (f.list === 'companyList') {
        const names = [...new Set(state.data.tours.map(r => (r.company || '').trim()).filter(n => n && n !== '-'))].sort((a, b) => a.localeCompare(b, 'ko'));
        input += '<datalist id="companyList">' + names.map(n => '<option value="' + esc(n) + '"></option>').join('') + '</datalist><span class="note" id="companyHint" role="status"></span>';
      }
      if (f.list === 'profileList') {
        // 예전에 낸 프로필 종류를 자주 쓴 순서로 드롭다운에, 없으면 '직접 쓰기'
        const cnt = {};
        state.data.tours.forEach(r => { const p = (r.profile || '').trim(); if (p && p !== '-') cnt[p] = (cnt[p] || 0) + 1; });
        const opts = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b, 'ko'));
        const known = !val || opts.includes(val);
        input = '<select id="f-profileSel" aria-label="프로필 종류 고르기"><option value="">고르기</option>'
          + opts.map(o => '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('')
          + '<option value="__new"' + (known ? '' : ' selected') + '>직접 쓰기…</option></select>'
          + '<input id="' + id + '" name="' + f.k + '" value="' + esc(val) + '" placeholder="새 프로필 종류 (예: (시노) 자켓 기본)"' + (known ? ' hidden' : '') + '>';
      }
      return '<div class="field"><label for="' + id + '">' + esc(f.label) + '</label>' + input + '</div>';
    };
    let fields = '', buf = [];
    schema.fields.forEach(f => {
      if (f.half) { buf.push(fieldHTML(f)); if (buf.length === 2) { fields += '<div class="pair">' + buf.join('') + '</div>'; buf = []; } }
      else { if (buf.length) { fields += '<div class="pair">' + buf.join('') + '</div>'; buf = []; } fields += fieldHTML(f); }
    });
    if (buf.length) fields += '<div class="pair">' + buf.join('') + '</div>';

    const pasteBox = coll === 'auditions' && !rec
      ? '<div class="paste"><strong>필름메이커스 공고 불러오기</strong><br>공고 페이지에서 북마크 버튼을 누른 뒤, 아래 칸에 붙여넣으면 자동으로 채워져요.<textarea id="pasteIn" placeholder="여기에 붙여넣기 (Ctrl+V / ⌘V)"></textarea></div>' : '';

    $('#layer').innerHTML = '<div class="scrim" data-close></div><form class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ph">'
      + '<div class="panel-h"><h2 id="ph">' + esc(schema.label) + (rec ? ' 수정' : ' 추가') + '</h2><button type="button" class="x" data-close aria-label="닫기">×</button></div>'
      + '<div class="panel-b">' + pasteBox + fields + '</div>'
      + '<div class="panel-f">' + (rec ? '<button type="button" class="btn danger" id="del">삭제</button>' : '<span></span>')
      + '<div style="display:flex;gap:8px"><button type="button" class="btn ghost" data-close>취소</button><button type="submit" class="btn">저장</button></div></div></form>';
    panelArmed = false;
    autoFilled.address = null; autoFilled.size = null;
    const panel = $('#panel');
    panel.dataset.coll = coll; panel.dataset.id = id || '';
    const first = $('#pasteIn') || panel.querySelector('input, select, textarea');
    if (first) first.focus();
    const pin = $('#pasteIn');
    if (pin) pin.addEventListener('paste', e => {
      const text = e.clipboardData.getData('text/plain');
      const data = parsePayload(text);
      if (data) { e.preventDefault(); fillPanel(data); pin.value = ''; toast('공고 내용을 채웠어요. 확인 후 저장하세요.'); }
    });
  }
  /* 업체명으로 지난 투어 기록에서 주소/층수, 규모 찾기 */
  const normCo = s => String(s || '').replace(/\(.*?\)|\s|[?.,·]/g, '').toLowerCase();
  function lastVisitOf(company, exceptId) {
    const key = normCo(company);
    if (key.length < 2) return null;
    const hits = state.data.tours.filter(r => r.id !== exceptId && normCo(r.company) === key && (r.address || r.size));
    if (!hits.length) return null;
    hits.sort((a, b) => (b.dateISO || '').localeCompare(a.dateISO || '') || (b.no || 0) - (a.no || 0));
    // 가장 최근 기록을 쓰되, 비어 있는 칸은 그 이전 기록에서 보충
    const pick = k => (hits.find(r => r[k] && r[k] !== '-') || {})[k] || '';
    return { address: pick('address'), size: pick('size'), dateISO: hits[0].dateISO };
  }
  const autoFilled = { address: null, size: null };
  function onCompanyInput(el) {
    const panel = $('#panel');
    if (!panel || (panel.dataset.coll !== 'tours' && panel.dataset.coll !== 'postings')) return;
    const hint = $('#companyHint');
    const v = lastVisitOf(el.value, panel.dataset.id);
    let used = false;
    ['address', 'size'].forEach(k => {
      const f = $('#f-' + k);
      if (!f) return;
      const canWrite = f.value === '' || f.value === autoFilled[k];
      if (!canWrite) return;
      const nv = v ? v[k] : '';
      if (v && nv) { f.value = nv; autoFilled[k] = nv; used = true; }
      else if (f.value === autoFilled[k]) { f.value = ''; autoFilled[k] = null; }
    });
    if (hint) hint.textContent = used ? (v.dateISO ? fmtDate(v.dateISO) + ' 방문 기록에서 주소·규모를 불러왔어요.' : '지난 방문 기록에서 주소·규모를 불러왔어요.') : '';
  }
  document.addEventListener('input', e => { if (e.target.id === 'f-company') onCompanyInput(e.target); });
  document.addEventListener('change', e => { if (e.target.id === 'f-company') onCompanyInput(e.target); });

  document.addEventListener('change', e => {
    if (e.target.id !== 'f-profileSel') return;
    const inp = $('#f-profile'), v = e.target.value;
    if (v === '__new') { inp.hidden = false; inp.value = ''; inp.focus(); }
    else { inp.hidden = true; inp.value = v; }
  });

  function fillPanel(data) {
    Object.entries(data).forEach(([k, val]) => { const el = $('#f-' + k); if (el && val !== undefined) el.value = val; });
  }
  function closePanel() { $('#layer').innerHTML = ''; }

  async function savePanel(e) {
    e.preventDefault();
    const panel = $('#panel');
    const coll = panel.dataset.coll, id = panel.dataset.id;
    const body = {};
    SCHEMA[coll].fields.forEach(f => { if (panel.elements[f.k]) body[f.k] = (panel.elements[f.k].value || '').trim(); });
    const pmWeek = body.pmWeek; delete body.pmWeek;
    if (id) {
      const old = state.data[coll].find(r => r.id === id) || {};
      putRec(coll, id, Object.assign({}, old, body));
      closePanel(); toast('저장했어요.');
      return;
    }
    body.order = Date.now();
    if (coll === 'tours' || coll === 'meetings') body.no = (Math.max(0, ...state.data[coll].map(r => r.no || 0)) + 1);
    const nid = uid();
    if (coll === 'postings' && pmWeek) {
      const b = panel.querySelector('[type=submit]'); b.disabled = true; b.textContent = '넣는 중…';
      try { const r = await pmAddWeek(pmWeek, [{ ref: nid, title: pmTitle(body), area: body.area }]); if (r.out[nid]) body.pm = r.out[nid]; toast(r.msg || '페이스메이커 ' + md(pmWeek) + ' 주 할 일에도 넣었어요.'); }
      catch (err) { toast('페이스메이커에는 넣지 못했어요. ' + aiErr(err)); }
    } else toast('저장했어요.');
    putRec(coll, nid, body);
    closePanel();
  }
  function deleteFromPanel() {
    const btn = $('#del');
    if (!panelArmed) { panelArmed = true; btn.classList.add('armed'); btn.textContent = '한 번 더 누르면 삭제'; return; }

    else if (lead) { const back = Object.assign({}, lead, { status: 'new' }); delete back.auditionId; putRec('leads', lead.id, back); toast('삭제했어요. 「' + (lead.title || lead.head) + '」는 온라인 공고로 돌아갔어요.'); }
    else toast('삭제했어요.');
  }

  /* ---------- 북마크 버튼으로 복사한 내용 ---------- */
  // 여자 배역(또는 성별 무관)만 남긴다. 해당 배역이 하나도 없으면 전체를 그대로 둔다.
  function applyRoleFilter(d) {
    if (!d || !Array.isArray(d.roles) || !d.roles.length) return d;
    const isMine = r => /여|무관/.test(r.gender || '');
    const picked = d.roles.filter(isMine);
    const list = picked.length ? picked : d.roles;
    d.role = list.map(r => {
      const g = picked.length ? (/무관/.test(r.gender) ? '성별 무관' : '') : r.gender;
      const inner = [g, r.age, r.desc].filter(Boolean).join(', ');
      return r.name + (inner ? ' (' + inner + ')' : '');
    }).join('\n');
    const pays = list.map(r => String(r.pay || '').replace(/\s*최저\s*/, ' ').replace(/만원$/, '').replace(/\s+/g, ' ').trim()).filter(Boolean);
    d.pay = pays.filter((p, i) => pays.indexOf(p) === i).join(', ');
    d._skipped = picked.length ? d.roles.length - picked.length : 0;
    delete d.roles; delete d.v;
    return d;
  }
  function parsePayload(text) {
    if (!text) return null;
    const m = text.match(/AUDITION_NOTE::(\{[\s\S]*\})/);
    if (m) { try { return applyRoleFilter(JSON.parse(m[1])); } catch (e) { return null; } }
    const u = text.trim().match(/^https?:\/\/(www\.)?filmmakers\.co\.kr\/\S+$/);
    if (u) return { link: text.trim() };
    return null;
  }
  document.addEventListener('paste', e => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    const data = parsePayload(e.clipboardData.getData('text/plain'));
    if (!data) return;
    e.preventDefault();
    const dup = data.link && state.data.auditions.find(r => r.link && r.link.split('?')[0] === data.link.split('?')[0]);
    location.hash = 'auditions';
    openPanel('auditions', null, data);
    toast(dup ? '이미 같은 링크의 기록이 있어요: ' + (dup.title || '') : (data.title ? '「' + data.title + '」 내용을 채웠어요.' + (data._skipped ? ' 남자 배역 ' + data._skipped + '개는 뺐어요.' : '') + ' 확인 후 저장하세요.' : '링크를 넣었어요. 나머지를 채워 저장하세요.'));
  });
  /* ================= 저장소: 페이스메이커와 같은 구글 시트 ================= */
  // 기록은 페이스메이커 시간표가 쓰는 구글 시트의 'data' 탭에 'an:' 로 시작하는 행으로 저장돼요.
  // 연결 정보(k, u)는 페이스메이커와 같은 것을 써요. 같은 주소(github.io)라 PC에선 자동으로 이어져요.
  const CFGK = 'pm-app-cfg', CACHEK = 'an-cache-v1', PENDK = 'an-pend-v1';
  const CODE = { auditions: 'au', tours: 'tr', agencies: 'ag', meetings: 'mt', postings: 'po', leads: 'ol' };
  const COLL = Object.fromEntries(Object.entries(CODE).map(([a, b]) => [b, a]));
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  (function takeHash() {
    const h = location.hash, k = h.match(/[#&]k=([^&]+)/), u = h.match(/[#&]u=([^&]+)/);
    if (k && u) {
      store.set(CFGK, JSON.stringify({ k: decodeURIComponent(k[1]), u: decodeURIComponent(u[1]) }));
      history.replaceState(null, '', location.pathname + '#online');
    }
  })();
  function cfg() { try { return JSON.parse(store.get(CFGK, 'null')); } catch (e) { return null; } }
  async function apiGet() {
    const c = cfg(); if (!c) throw { code: 'nocfg' };
    const r = await fetch(c.u + '?k=' + encodeURIComponent(c.k) + '&t=' + Date.now());
    const j = await r.json(); if (!j.ok) throw { code: j.err || 'fail' };
    return j.data || {};
  }
  async function apiPost(body) {
    const c = cfg(); if (!c) throw { code: 'nocfg' };
    const r = await fetch(c.u, { method: 'POST', body: JSON.stringify(Object.assign({ k: c.k }, body)) });
    const j = await r.json(); if (!j.ok) throw { code: j.err || 'fail', message: j.msg || '' };
    return j;
  }
  const RAW = {};          // 시트에 있는 an: 값
  let PEND = {};           // 아직 시트에 못 보낸 값
  try { PEND = JSON.parse(store.get(PENDK, '{}')) || {}; } catch (e) { PEND = {}; }
  function rebuild() {
    const d = { auditions: [], tours: [], agencies: [], meetings: [], postings: [], leads: [] };
    const all = Object.assign({}, RAW, PEND);
    Object.keys(all).forEach(k => {
      const p = k.split(':'); if (p[0] !== 'an' || !COLL[p[1]] || !all[k]) return;
      try { d[COLL[p[1]]].push(Object.assign(JSON.parse(all[k]), { id: p.slice(2).join(':') })); } catch (e) {}
    });
    state.data = d;
  }
  function cacheLocal() { store.set(CACHEK, JSON.stringify(RAW)); store.set(PENDK, JSON.stringify(PEND)); }
  function setSync(s) {
    const el = $('#sync'); if (!el) return;
    el.className = 'sync' + (s === 'error' || s === 'offline' ? ' err' : '');
    el.textContent = { saving: '저장 중…', saved: '저장됨', error: '저장 못 함 · 다시 시도할게요', offline: '연결 안 됨', loading: '불러오는 중…' }[s] || '';
  }
  // 한 건 저장(obj=null 이면 삭제)
  function putRec(coll, id, obj) {
    const k = 'an:' + CODE[coll] + ':' + id;
    if (obj) { const o = Object.assign({}, obj); delete o.id; PEND[k] = JSON.stringify(o); } else PEND[k] = '';
    rebuild(); cacheLocal(); render(); scheduleFlush();
  }
  let FT = null, BUSY = false, AGAIN = false;
  function scheduleFlush() { setSync('saving'); clearTimeout(FT); FT = setTimeout(flush, 600); }
  async function flush() {
    if (BUSY) { AGAIN = true; return; }
    const puts = Object.assign({}, PEND); if (!Object.keys(puts).length) { setSync('saved'); return; }
    BUSY = true;
    try {
      await apiPost({ puts });
      Object.keys(puts).forEach(k => { RAW[k] = puts[k]; if (PEND[k] === puts[k]) delete PEND[k]; });
      cacheLocal(); setSync(Object.keys(PEND).length ? 'saving' : 'saved');
    } catch (e) { setSync(e && e.code === 'nocfg' ? 'offline' : 'error'); setTimeout(scheduleFlush, 8000); }
    BUSY = false; if (AGAIN) { AGAIN = false; flush(); }
  }
  let LASTPULL = 0;
  async function pull(force) {
    if (!force && Date.now() - LASTPULL < 15000) return; LASTPULL = Date.now();
    if (!cfg()) { state.dbState = 'setup'; render(); return; }
    try {
      const all = await apiGet();
      Object.keys(RAW).forEach(k => delete RAW[k]);
      Object.keys(all).forEach(k => { if (k.startsWith('an:')) RAW[k] = all[k]; });
      state.dbState = 'ready'; rebuild(); cacheLocal(); render();
      if (Object.keys(PEND).length) scheduleFlush(); else setSync('saved');
    } catch (e) {
      if (e && e.code === 'auth') { state.dbState = 'setup'; render(); return; }
      setSync('offline'); if (state.dbState === 'loading') { state.dbState = 'ready'; render(); }
    }
  }
  function bootStore() {
    try { Object.assign(RAW, JSON.parse(store.get(CACHEK, '{}')) || {}); } catch (e) {}
    if (cfg() && (Object.keys(RAW).length || Object.keys(PEND).length)) { state.dbState = 'ready'; rebuild(); }
    render(); setSync(cfg() ? 'loading' : '');
    pull(true).then(announceKnown);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(false); });
  }

  // 크롬 북마크를 복사해 붙여 넣으면 이름 | 주소 줄로 바꾸기 (스레드·구글 시트 제외)
  const skipLink = u => /(^|\.)threads\.(net|com)\//i.test(u.replace(/^https?:\/\//, '')) || /docs\.google\.com\/spreadsheets/i.test(u);
  document.addEventListener('paste', e => {
    if (!e.target || e.target.id !== 'scIn') return;
    const html = e.clipboardData.getData('text/html'), text = e.clipboardData.getData('text/plain');
    let rows = [];
    if (html && /<a\s/i.test(html)) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      rows = [...doc.querySelectorAll('a[href]')].map(a => ({ n: a.textContent.trim(), u: a.getAttribute('href') }));
    } else if (/https?:\/\//.test(text)) {
      rows = text.split(/\n/).map(x => x.trim()).filter(x => /^https?:\/\//.test(x)).map(u => ({ n: '', u }));
    } else return;
    e.preventDefault();
    const lines = rows.filter(r => /^https?:\/\//.test(r.u) && !skipLink(r.u)).map(r => {
      let n = r.n; if (!n) { try { n = new URL(r.u).hostname.replace(/^www\./, ''); } catch (er) { n = r.u; } }
      return n.replace(/\s*[|｜]\s*/g, ' ') + ' | ' + r.u;
    });
    const el = e.target, cur = el.value.trim();
    el.value = (cur ? cur + '\n' : '') + lines.join('\n');
    const skipped = rows.length - lines.length;
    toast(lines.length + '개를 넣었어요.' + (skipped ? ' 스레드·구글 시트 ' + skipped + '개는 뺐어요.' : '') + ' 확인하고 저장을 눌러 주세요.');

  /* ---------- 나에게 맞는 배역 (여자 · 20대 초반~30대 중반) ---------- */
  function ageRange(s) {
    const conv = (p, end) => {
      let m = p.match(/(\d+)대\s*(초반|중반|후반)?/);
      if (m) { const d = +m[1], q = m[2]; return q === '초반' ? (end ? d + 3 : d) : q === '중반' ? (end ? d + 6 : d + 4) : q === '후반' ? (end ? d + 9 : d + 7) : (end ? d + 9 : d); }
      m = p.match(/(\d+)\s*세/); if (m) return +m[1];
      if (/아역/.test(p)) return end ? 12 : 0;
      return null;
    };
    const ps = String(s || '').split('~'); const a = conv(ps[0], false), b = conv(ps[ps.length - 1], true);
    return a == null || b == null ? null : [a, b];
  }
  const AGE_MIN = 20, AGE_MAX = 36;
  const roleFits = r => /여|무관/.test(r.gender || '여') && (() => { const a = ageRange(r.age); return !a || (a[0] <= AGE_MAX && a[1] >= AGE_MIN); })();
  const payShort = p => String(p || '').replace(/\s*최저\s*/, ' ').replace(/만원$/, '').replace(/\s+/g, ' ').trim();
  const roleLine = r => r.name + ' (' + [/무관/.test(r.gender || '') ? '성별 무관' : '', r.age, r.desc].filter(Boolean).join(', ') + ')';

            + (l.status !== 'new' ? '<button type="button" class="btn ghost sm" data-lundo="' + esc(l.id) + '">되돌리기</button>' : '')
          : '<button type="button" class="btn sm" data-lsave="' + esc(l.id) + '">지원 현황에 담기</button><button type="button" class="btn ghost sm" data-lpass="' + esc(l.id) + '">넘기기</button>')

    if (fresh.length) h += '<div class="group-h"><h3>새 공고</h3><span class="n">' + fresh.length + '건</span></div><div class="rows">' + fresh.map(l => row(l, false)).join('') + '</div>';
    else h += emptyState(all.length ? '새로 들어온 공고가 없어요' : '아직 모아 온 공고가 없어요',

    if (rest.length) h += '<details class="due" style="margin-top:18px"><summary style="cursor:pointer;font-weight:600">담은 공고 · 넘긴 공고 · 마감 지난 공고 (' + rest.length + ')</summary><div class="rows" style="margin-top:10px">' + rest.slice(0, 60).map(l => row(l, true)).join('') + '</div></details>';
    h += bookmarkBoxHTML();
    return h;
  }

  /* ---------- 공고 → 지원 현황 ---------- */
  function leadToAudition(l) {
    const map = { '단편영화': '단편', '장편 독립영화': '장편 독립', '장편 상업영화': '장편 상업', 'OTT/TV 시리즈': 'OTT/TV', '웹드라마/숏폼': '웹드라마/숏폼', '연극/뮤지컬': '연극/뮤지컬' };
    let gubun = map[l.cat] || l.cat || '';
    const sc = (l.maker || '').match(/([가-힣A-Za-z]+?)대학교/); if (sc && gubun && gubun.indexOf('(') < 0) gubun += ' (' + sc[1] + '대)';
    return {
      kind: '작품', status: '지원 예정', link: l.link || '', deadlineISO: l.deadlineISO || '', deadlineText: l.deadlineText || '', gubun,
      shoot: l.shoot || '', title: l.title || l.head || '', role: (l.roles || []).map(roleLine).join('\n'), pay: l.pay || '',
      statusNote: '', auditionDate: '', note: (l.points || []).join(', '), order: Date.now(),
    };
  }
  document.addEventListener('click', e => {
    const t = e.target;
    const s = t.closest('[data-lsave]'), p = t.closest('[data-lpass]'), u = t.closest('[data-lundo]');
    if (s) {
      const l = state.data.leads.find(x => x.id === s.dataset.lsave); if (!l) return;
      const aid = uid(); putRec('auditions', aid, leadToAudition(l));

  /* ---------- 필름메이커스 북마크에서 보낸 공고 받기 ---------- */
  function knownIds() {
    const ids = new Set(getMeta('fmseen', []));
    state.data.leads.forEach(l => { if (l.postId) ids.add(String(l.postId)); });
    state.data.auditions.forEach(a => { const m = String(a.link || '').match(/(?:castingPro|actorCasting|performerCasting)\/(\d+)/); if (m) ids.add(m[1]); });
    return [...ids];
  }
  let LAST_BATCH = '';
  window.addEventListener('message', e => {
    if (!/^https:\/\/(www\.)?filmmakers\.co\.kr$/.test(e.origin) || !e.data || e.data.type !== 'an-fm-batch') return;
    try { e.source.postMessage({ type: 'an-ack' }, e.origin); } catch (er) {}
    if (e.data.batch === LAST_BATCH) return; LAST_BATCH = e.data.batch;
    ingestFm(Array.isArray(e.data.items) ? e.data.items.slice(0, 40) : [], Array.isArray(e.data.skipped) ? e.data.skipped : []);
  });
  function announceKnown() {
    if (!window.opener) return;
    let n = 0;
    const tick = () => { if (LAST_BATCH || n++ > 30) return; try { window.opener.postMessage({ type: 'an-known', ids: knownIds() }, '*'); } catch (e) {} setTimeout(tick, 1000); };
    tick();
  }
  async function ingestFm(items, skipped) {
    location.hash = 'online';
    const have = new Set(state.data.leads.map(l => String(l.postId)));
    const seen = getMeta('fmseen', []);
    const keep = [], drop = [...skipped];
    items.forEach(it => {
      if (!it || !it.id || have.has(String(it.id))) return;
      const fits = (it.roles || []).filter(r => r && roleFits(r));
      if ((it.roles || []).length && !fits.length) { drop.push(it.id); return; }
      it.fits = fits; keep.push(it);
    });
    putMeta('fmseen', [...new Set([...seen, ...drop.map(String), ...keep.map(it => String(it.id))])].slice(-800));
    if (!keep.length) { state.ingest = ''; render(); toast(items.length ? '새 공고 ' + items.length + '건 중 맞는 배역이 있는 공고가 없었어요.' : '새로 올라온 맞는 공고가 없어요.'); return; }
    let done = 0; const base = Date.now();
    state.ingest = '새 공고 ' + keep.length + '건을 요약하는 중이에요…'; render();
    for (let i = 0; i < keep.length; i += 8) {
      const part = keep.slice(i, i + 8);
      let notes = {};
      try { const r = await aiCall(curatePrompt(part), []); (r.items || []).forEach(x => { if (x && x.id) notes[String(x.id)] = x; }); }
      catch (e) { toast('요약은 하지 못했어요. 공고만 담았어요. (' + aiErr(e) + ')'); }
      part.forEach((it, j) => {
        const n = notes[String(it.id)] || {};
        const pays = it.fits.map(r => payShort(r.pay)).filter(Boolean);
        putRec('leads', 'fm-' + it.id, {
          status: 'new', src: 'fm', postId: String(it.id), link: it.link, head: it.head || '', title: it.title || it.head || '', cat: it.gubun || '', maker: it.maker || '',
          deadlineISO: it.deadlineISO || '', deadlineText: it.deadlineText || '', shoot: it.shoot || '', area: it.area || '', audition: it.audition || '',
          pay: pays.filter((p, k) => pays.indexOf(p) === k).join(', '), roles: it.fits.map(r => ({ name: r.name, gender: r.gender, age: r.age, desc: String(r.desc || '').slice(0, 200) })),
          otherRoles: (it.roles || []).length - it.fits.length, summary: n.summary || '', points: Array.isArray(n.points) ? n.points.slice(0, 4) : [], pick: n.pick || '', why: n.why || '', order: base + i + j,
        });
      });
      done += part.length;
      state.ingest = done < keep.length ? '새 공고 ' + keep.length + '건 중 ' + done + '건 요약했어요…' : ''; render();
    }
    toast('새 공고 ' + keep.length + '건을 가져왔어요.' + (drop.length ? ' 조건에 안 맞는 ' + drop.length + '건은 뺐어요.' : ''));
  }
  function curatePrompt(items) {

지원할 만한 배역: ${(it.fits || []).map(r => r.name + ' (' + [r.gender, r.age, r.pay, r.desc].filter(Boolean).join(', ') + ')').join(' / ') || '(배역 정보 없음)'}

- pick: "추천" | "괜찮음" | "애매" 중 하나. 페이, 제작 주체의 신뢰도, 배역 비중, 무리한 조건(무페이·노출·먼 지방·촉박한 일정)을 보고 정해.

답 형식(JSON만): {"items":[{"id":"","summary":"","points":[],"pick":"","why":""}]}`;

  /* ================= 투어 공고 ================= */
  function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function mondayOf(iso) { const d = new Date(iso + 'T00:00:00Z'); return addDays(iso, -((d.getUTCDay() + 6) % 7)); }
  const md = iso => { const [, m, d] = iso.split('-').map(Number); return m + '/' + d; };

  // 카카오맵 검색어: 주소에서 도로명+건물번호만 뽑고, 층·호수·괄호 설명은 뺀다
  function mapQuery(addr) {
    const s = String(addr || '').replace(/\s+/g, ' ');
    const m = s.match(/([가-힣]+(?:시|구|군)\s)?[가-힣0-9.]+(?:로|길)(?:\s?\d+(?:번?길))?\s?\d+(?:-\d+)?/);
    if (m) return m[0].trim();
    return s.replace(/\(.*?\)/g, ' ').replace(/(지하\s*)?\d+\s*층|B\d+|\d+\s*호/gi, ' ').replace(/[,·]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  /* ---------- 페이스메이커 주간 할 일 ---------- */
  const WKMAX = 5;
  // items: [{title, ref}] → 반환: {ref: {mon,id,sub?}} 와 안내 문구
  async function pmAddWeek(mon, items) {
    const all = await apiGet();
    const key = 'todo:' + mon.slice(0, 7);
    let o = {}; try { o = JSON.parse(all[key] || '{}') || {}; } catch (e) { o = {}; }
    const wk = o['wk:' + mon] = o['wk:' + mon] || { tasks: [] }; wk.tasks = wk.tasks || [];
    const free = WKMAX - wk.tasks.length, out = {};
    let msg = '';
    if (free <= 0) return { out, msg: md(mon) + ' 주 할 일이 이미 ' + WKMAX + '개라 페이스메이커에는 넣지 못했어요.' };
    const single = items.length <= free ? items : items.slice(0, free - 1);
    single.forEach(it => { const id = uid(); wk.tasks.push({ id, pri: 0, t: it.title, done: false, sub: [] }); out[it.ref] = { mon, id }; });
    const rest = items.slice(single.length);
    if (rest.length) {
      const id = uid(), areas = [...new Set(rest.map(it => it.area).filter(Boolean))];
      const sub = rest.map(it => { const sid = uid(); out[it.ref] = { mon, id, sub: sid }; return { id: sid, t: it.title, done: false }; });
      wk.tasks.push({ id, pri: 0, t: '프로필투어 ' + rest.length + '곳' + (areas.length ? ' (' + areas.join('·') + ')' : ''), done: false, sub, open: true });
      msg = '이번 주 할 일 자리가 모자라서 ' + rest.length + '곳은 한 줄로 묶어 넣었어요.';
    }
    await apiPost({ puts: { [key]: JSON.stringify(o) } });
    return { out, msg };
  }
  async function pmMarkDone(pm, done) {
    if (done === undefined) done = true;
    if (!pm || !pm.mon) return false;
    const all = await apiGet(), puts = {};
    const days = Array.from({ length: 7 }, (_, i) => addDays(pm.mon, i));
    const keys = [...new Set([pm.mon, ...days].map(d => 'todo:' + d.slice(0, 7)))];
    let hit = false;
    keys.forEach(key => {
      let o; try { o = JSON.parse(all[key] || '{}') || {}; } catch (e) { return; }
      let changed = false;
      const mark = t => {
        if (!t || t.id !== pm.id) return;
        if (pm.sub) { const s = (t.sub || []).find(x => x.id === pm.sub); if (s && !!s.done !== done) { s.done = done; changed = true; } const all = (t.sub || []).length && t.sub.every(x => x.done); if (!!t.done !== !!all) { t.done = !!all; changed = true; } }
        else if (!!t.done !== done) { t.done = done; changed = true; }
      };
      const w = o['wk:' + pm.mon]; if (w && w.tasks) w.tasks.forEach(mark);
      days.forEach(d => { const x = o[d]; if (x && x.tasks) x.tasks.forEach(mark); });
      if (changed) { puts[key] = JSON.stringify(o); hit = true; }
    });
    if (Object.keys(puts).length) await apiPost({ puts });
    return hit;
  }

  // 다녀옴을 되돌려 '다녀올 곳'으로. dropTour=true 면 연결된 다녀온 투어 기록도 지운다
  function unvisit(id, dropTour) {

  /* ---------- AI 비서 공통 ---------- */
  async function shrinkImg(file) {
    try {
      const bmp = await createImageBitmap(file); const m = 1600, sc = Math.min(1, m / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      return await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
    } catch (e) { return file; }
  }
  async function aiCall(prompt, images) {
    const imgs = await Promise.all((images || []).map(b => new Promise(res => { const fr = new FileReader(); fr.onload = () => res({ media_type: b.type || 'image/jpeg', data: String(fr.result).split(',')[1] }); fr.readAsDataURL(b); })));
    const r = await apiPost({ ai: { prompt, images: imgs } });
    if (!r.data) throw { code: 'noai' };
    return r.data;
  }
  function aiErr(e) {
    const c = e && e.code;
    return c === 'nokey' ? 'AI 키가 아직 없어요. 오른쪽 위 ⋯ 메뉴 → AI 키 설정에서 넣어 주세요.'
      : c === 'badkey' ? 'AI 키가 맞지 않아요. ⋯ 메뉴 → AI 키 설정에서 다시 넣어 주세요.'
      : c === 'billing' ? 'API 크레딧이 없거나 결제 한도에 닿았어요. console.anthropic.com에서 확인해 주세요.'
      : c === 'rate_limited' ? '잠깐 너무 많이 썼어요. 조금 뒤에 다시 해 주세요.'
      : c === 'nocfg' || c === 'auth' ? '구글 시트 연결이 필요해요. ⋯ 메뉴 → 연결 다시 설정하기를 눌러 주세요.'
      : c === 'fetch' ? '링크를 열지 못했어요. 캡처를 올려 주세요.'
      : '처리하지 못했어요. 다시 시도해 주세요.' + (e && e.message ? ' (' + e.message + ')' : '');
  }

  async function runRoute() {
    const ids = [...document.querySelectorAll('[data-rp]')].filter(c => c.checked).map(c => c.dataset.rp);
    const ps = ids.map(id => state.data.postings.find(p => p.id === id)).filter(p => p && p.address);
    if (ps.length < 2) { $('#rErr').textContent = '주소가 있는 곳을 2곳 이상 골라 주세요.'; return; }
    const start = $('#rStart').value.trim() || '신촌역', date = $('#rDate').value || todayISO(), cond = $('#rCond').value.trim();
    store.set('an.rstart', start); store.set('an.rcond', cond);
    $('#rErr').textContent = ''; $('#routeRun').disabled = true;
    $('#rOut').innerHTML = '<div class="wait"><span class="spark spin">✦</span> 동선을 짜는 중이에요…</div>';
    const prompt = `너는 서울 지리와 대중교통(지하철·버스·도보)에 밝은 이동 동선 도우미야. 배우가 프로필 투어로 아래 장소들을 돌아야 해. 이동 시간이 가장 적게 드는 방문 순서를 짜서 JSON으로만 답해.
출발지: ${start} / 날짜: ${date} (${DAYS[new Date(date + 'T00:00:00Z').getUTCDay()]}요일)${cond ? ' / 조건: ' + cond : ''}
[장소: id | 이름 | 주소 | 마감일 | 방문 가능 시간]
${ps.map(p => [p.id, postLabel(p) + (p.company ? ' (' + p.company + ')' : ''), p.address, p.deadlineISO || p.deadlineText || '-', p.hours || '-'].join(' | ')).join('\n')}
규칙:
- 같은 동네끼리 묶고, 되돌아가지 않게 순서를 정해. 걸어서 15분 안이면 걷는 걸로.
- 날짜·마감일·방문 가능 시간·조건을 지켜. 하루에 무리면 days를 여러 개로 나누고, 마감이 빠른 곳을 앞날에 넣어.
- 날짜에 방문할 수 없는 곳(주말 휴무 등)이 확실하면 skipped에 넣고 이유를 써.
- move에는 직전 장소(첫 곳은 출발지)에서 오는 방법과 대략 시간을 짧게(예: "2호선 신촌→을지로3가 환승 3호선 신사역, 약 30분"). 모르면 "약 20분" 정도로 어림잡아.
- arrive는 대략 도착 시각 HH:MM(출발 10:00 기준, 조건에 시간이 있으면 그에 맞춰).
답 형식(JSON만):
{"reply":"한두 문장 요약(총 소요 시간 포함)","days":[{"title":"1일차 · 신사·논현","stops":[{"id":"","arrive":"10:30","move":"","tip":""}]}],"skipped":[{"id":"","why":""}],"tips":["짧은 팁"]}`;
    try {
      const res = await aiCall(prompt, []);
      const byId = Object.fromEntries(ps.map(p => [p.id, p]));
      let h = '<div class="reply">' + esc(res.reply || '') + '</div>';
      (res.days || []).forEach(d => {
        h += '<div class="plan-day"><h4>' + esc(d.title || '') + '</h4>' + (d.stops || []).map((s, i) => {
          const p = byId[s.id]; if (!p) return '';
          return '<div class="stop"><span class="no">' + (i + 1) + '</span><div><b>' + esc(postLabel(p)) + '</b>' + (s.arrive ? ' <span class="date dim">' + esc(s.arrive) + ' 도착</span>' : '')
            + '<div class="addr">' + esc(p.address) + '</div>' + (s.move ? '<div class="move">↳ ' + esc(s.move) + '</div>' : '') + (s.tip ? '<div class="note">' + esc(s.tip) + '</div>' : '')
            + '<div class="acts" style="margin-top:6px">' + kakaoBtn(p.address, true) + '</div></div></div>';
        }).join('') + '</div>';
      });
      if ((res.skipped || []).length) h += '<div class="note">이번엔 빠진 곳: ' + res.skipped.map(s => esc((byId[s.id] ? postLabel(byId[s.id]) : s.id) + ' — ' + (s.why || ''))).join(' / ') + '</div>';
      if ((res.tips || []).length) h += '<ul class="note" style="margin:0;padding-left:18px">' + res.tips.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>';
      $('#rOut').innerHTML = h;
    } catch (e) { $('#rOut').innerHTML = ''; $('#rErr').textContent = aiErr(e); }
    const b = $('#routeRun'); if (b) { b.disabled = false; b.textContent = '다시 추천받기'; }
  }
