<!DOCTYPE html>
<html lang="ko">
<head>
<script>window.PM_PWA=1</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시간표">
<meta name="theme-color" content="#f5f6f8">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="ic2-180.png">
<link rel="icon" href="ic2-192.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시간표 · 2027 페이스메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#141821;--sub:#5d6575;--mute:#9aa1ae;--line:#e5e8ee;--line2:#eef0f4;
  --blue:#2453d6;--blue-d:#173a9e;--blue-50:#f1f5ff;--blue-100:#e2eaff;--blue-200:#c6d5ff;--navy:#0e1b3d;
  --attn:#e8913a;--r:16px;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
.serif{font-family:'Noto Serif KR',serif;letter-spacing:-0.02em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
textarea,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.88);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.mark{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{display:block;font-size:15px;font-weight:700}
.brand small{display:block;color:var(--sub);font-size:11.5px;margin-top:-2px}
#nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;color:var(--sub);font-weight:500;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--ink);background:#fff}
.tab.on{background:var(--ink);color:#fff}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-style:normal;margin-left:6px;padding:0 5px;vertical-align:1px}
.save{font-size:12px;color:var(--sub);white-space:nowrap;display:flex;align-items:center;gap:6px}
.save::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--mute)}
.save.saved::before{background:#3bb07a}.save.saving::before{background:var(--blue)}.save.error::before{background:#d64545}.save.local::before{background:var(--attn)}
main{max-width:1200px;margin:0 auto;padding:28px 24px 90px}
@media(max-width:760px){.top-in{flex-wrap:wrap;gap:10px;padding:10px 16px}#nav{order:3;flex-basis:100%}main{padding:20px 16px 80px}.save span{display:none}}
/* common */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:28px;margin:0 0 4px;font-weight:600}
.page-head p{margin:0;color:var(--sub);max-width:46em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.card+.card{margin-top:16px}
.grid>.card{margin-top:0}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.desc{color:var(--sub);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--blue);margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:900px){.g2,.g3,.g21{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blue-200);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d);color:#fff}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.ghost:hover{color:var(--blue);background:var(--blue-50)}
.btn.danger{color:#c03535}
.btn.danger:hover{border-color:#f0c4c4;color:#c03535}
.link{color:var(--blue);font-size:13px;font-weight:500}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;background:#eaecf1;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:8px;font-size:14px;color:var(--sub);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.sm{border-radius:9px}
.seg.sm button{padding:4px 9px;font-size:12px;border-radius:7px}
.seg.st button.on[data-v="doing"]{color:var(--blue)}
.seg.st button.on[data-v="done"]{background:var(--blue);color:#fff}
.seg.st button.on[data-v="rest"]{color:#5b7a9a}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--sub);position:relative;white-space:nowrap;transition:.12s}
.chip:hover{border-color:var(--blue-200);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.flag::after{content:'';position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--attn);border:2px solid var(--bg)}
.chip .n{display:inline-block;font-size:11px;color:var(--mute);margin-right:4px}
.chip.on .n{color:#aab3c5}
.chip.empty{color:var(--mute);border-style:dashed}
.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfd;resize:none;outline:none;transition:border-color .15s, box-shadow .15s, background .15s;line-height:1.6;font-size:14px}
.f:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-100)}
.f::placeholder{color:#a5acb8;font-size:13px;line-height:1.65}
select.f{padding:9px 10px;cursor:pointer}
label.l{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
label.l:first-child{margin-top:0}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--blue-50);border-radius:12px;padding:12px 14px;font-size:13px;color:#2c3a5e;line-height:1.6;margin-top:12px}
.hint::before{content:'';flex:none;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:8px}
.hint.ok::before{background:#3bb07a}
.hint b{font-weight:600}
.empty-state{text-align:center;padding:40px 20px;color:var(--sub)}
.empty-state h3{justify-content:center;color:var(--ink)}
.foot-pace{text-align:center;color:var(--mute);font-family:'Noto Serif KR',serif;font-size:14px;margin:36px 0 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
/* hero */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero-main{background:linear-gradient(135deg,#0e1b3d 0%,#1a3a98 100%);color:#fff;border-radius:20px;padding:30px;position:relative;overflow:hidden;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.hero-main::after{content:'';position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.hero-main::before{content:'';position:absolute;right:30px;bottom:-110px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.hero-main .eyebrow{color:#a9bdf0}
.hero-main h1{font-size:32px;margin:6px 0 0;font-weight:600}
.pace{font-family:'Noto Serif KR',serif;font-size:17px;line-height:1.7;color:#e6ecff;margin:22px 0 0;max-width:30em;position:relative;z-index:1}
.core-card{display:flex;flex-direction:column;justify-content:space-between}
.core-txt{font-family:'Noto Serif KR',serif;font-size:21px;line-height:1.5;margin:8px 0 10px;white-space:pre-wrap}
.word{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--blue-50);color:var(--blue-d);font-weight:600;font-size:13px}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#fafbfc;border:1px solid var(--line2)}
.steps .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid #cfd5df;display:grid;place-items:center;font-size:12px;color:var(--mute);flex:none}
.steps li.done .dot{background:var(--blue);border-color:var(--blue);color:#fff}
.steps li.done .t{color:var(--mute);text-decoration:line-through}
.steps .t{flex:1;font-size:14px}
/* today habits */
.hlist{display:grid;gap:8px}
.hitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:#fafbfc}
.hitem .ck{margin:0}
.hitem .nm{flex:1;font-weight:500}
.hitem small{color:var(--mute);font-size:12px;display:block;font-weight:400}
.hitem .wk{font-size:12px;color:var(--sub)}
.sched{display:grid;gap:6px}
.sch{display:flex;gap:12px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px}
.sch .tm{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;min-width:92px}
.sch .bar-c{width:4px;height:22px;border-radius:2px;flex:none}
.gp{display:grid;gap:12px}
.gp-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer}
.gp-row .n{font-size:12px;color:var(--mute);font-weight:600}
.gp-row .gtt{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-row .st{font-size:12px;color:var(--sub);white-space:nowrap}
.gp-row .bar{grid-column:2/4}
.bar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
/* pending */
.pending{border:1px solid var(--blue-200);background:var(--blue-50);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.pending-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px}
.pending-h b{font-weight:600}
.pending-h span{font-size:12px;color:var(--blue);background:#fff;border-radius:999px;padding:2px 8px}
.pitem{background:#fff;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:start}
.pitem+.pitem{margin-top:8px}
.ptitle{font-size:14px;font-weight:500}
.ptitle small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.plinks{grid-column:1/2;display:flex;flex-wrap:wrap;gap:6px}
.plink{font-size:12.5px;color:var(--blue-d);background:var(--blue-50);border-radius:8px;padding:4px 9px;text-align:left}
.plink:hover{background:var(--blue-100)}
.pitem .btn{grid-row:1/3;grid-column:2}
/* mandalart */
.mand-top{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.mand-top .f{max-width:420px}
.mand-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media(max-width:1080px){.mand-layout{grid-template-columns:1fr}}
.mand-scroll{overflow-x:auto;padding:2px 2px 8px}
.mand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-width:740px}
.blk{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--line);padding:3px;border-radius:13px}
.blk.center{background:var(--blue-200)}
.mc{width:100%;aspect-ratio:1/1;border:0;border-radius:9px;background:#fff;resize:none;text-align:center;padding:0 8px;font-size:11.5px;line-height:1.45;letter-spacing:-0.02em;outline:none;display:block;overflow:hidden;transition:box-shadow .12s;word-break:keep-all;overflow-wrap:break-word;white-space:pre-wrap}
.mc:focus{box-shadow:inset 0 0 0 2px var(--blue);position:relative;z-index:1}
.mcw{position:relative}
.grip{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#b4bccb;opacity:0;cursor:grab;touch-action:none;z-index:2;transition:opacity .12s,background .12s}
.mcw:hover .grip,.mcw:focus-within .grip{opacity:1}
@media(hover:none){.mcw.has .grip{opacity:.45}}
.grip:hover{background:var(--blue-50);color:var(--blue)}
.mc.core~.grip{display:none}
.memo-dot{position:absolute;bottom:4px;right:4px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--blue);opacity:0;z-index:2}
.memo-dot.show{opacity:.85}
.mcw:hover .memo-dot{opacity:1}
.mcw:hover .memo-dot:not(.show){opacity:.4}
.memo-dot:hover{background:var(--blue-50)}
.mcw.empty .memo-dot:not(.show),.mcw.empty .grip{display:none}
.mcw.dragging{opacity:.35}
.mcw.drop .mc{box-shadow:inset 0 0 0 2px var(--blue)!important;background:var(--blue-50)!important}
.blk.drop-blk{outline:2px dashed var(--blue);outline-offset:2px}
body.dragmode,body.dragmode *{cursor:grabbing!important;user-select:none!important}
.dragghost{position:fixed;z-index:80;pointer-events:none;padding:8px 12px;border-radius:10px;background:var(--ink);color:#fff;font-size:12.5px;max-width:180px;box-shadow:0 10px 30px rgba(14,27,61,.3);transform:translate(-50%,-120%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .memo{display:block;font-size:12px;color:var(--sub);margin-top:2px;white-space:pre-wrap}
.star{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;opacity:0;transition:opacity .12s,background .12s;z-index:2;color:#b4bccb}
.star svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.mcw:hover .star,.mcw:focus-within .star{opacity:1}
.mcw.has .star{opacity:.35}
@media(hover:none){.mcw.has .star{opacity:.5}}
.star:hover{background:var(--blue-50);color:var(--blue)}
.mcw.on .star{opacity:1;color:#f0a020}
.mcw.on .star svg{fill:currentColor;stroke:currentColor}
.mcw.on .mc{box-shadow:inset 0 0 0 2px #f3c56b;background:#fffaf0}
.mcw.on .mc.core{box-shadow:inset 0 0 0 2px #f3c56b;background:var(--navy)}
.mcw.on .mc.gt{background:#fff7e6}
.mcw.on .mc:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.mcw.empty .star{display:none}
.imp-list{display:grid;gap:6px;margin-top:4px}
.imp{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.5;cursor:pointer}
.imp svg{flex:none;margin-top:3px;fill:#f0a020}
.imp small{color:var(--mute);font-size:12px;display:block}
.item.on{background:#fffaf0;border-color:#f3dca8}
.item .st{color:#f0a020;display:grid;place-items:center}
.item .st svg{fill:currentColor}
.mc::placeholder{color:#b0b6c1;font-size:10.5px;line-height:1.45;font-weight:400}
.mc.gt{background:var(--blue-50);font-weight:600;color:var(--blue-d);font-size:12px}
.mc.gt::placeholder{color:#8ea3d6}
.mc.core{background:var(--navy);color:#fff;font-weight:600;font-size:12.5px;line-height:1.5;font-family:'Noto Serif KR',serif}
.mc.core::placeholder{color:#8899c6}
.mc.gtc{background:#fff;font-weight:600;color:var(--blue-d);box-shadow:inset 0 0 0 1.5px var(--blue-200);font-size:12px}
.mc.gtc::placeholder{color:#a9b8de}
.guide h3{font-family:'Noto Serif KR',serif;font-size:17px}
.prin{list-style:none;margin:10px 0 0;padding:0;counter-reset:p}
.prin li{counter-increment:p;padding:10px 0 10px 34px;position:relative;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.6;color:#39404d}
.prin li:first-child{border-top:0}
.prin li::before{content:counter(p);position:absolute;left:0;top:11px;width:22px;height:22px;border-radius:50%;background:var(--blue-50);color:var(--blue);font-size:12px;font-weight:600;display:grid;place-items:center}
.prin b{color:var(--ink);display:block;font-weight:600}
.fill{display:flex;gap:16px;margin:4px 0 2px}
.fill div{flex:1}
.fill small{display:block;color:var(--sub);font-size:12px;margin-bottom:4px}
.lockpill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--blue-50);color:var(--blue-d);font-size:13px;font-weight:500}
.lockpill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--blue)}
/* exec */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pickrow{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin-bottom:10px;scrollbar-width:thin}
.mg-row{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);position:relative}
.mg-row:first-of-type{border-top:0}
.mg-row.flag::before{content:'점검';position:absolute;left:-8px;top:14px;transform:translateX(-100%);font-size:11px;color:#fff;background:var(--attn);border-radius:6px;padding:1px 6px}
@media(max-width:900px){.mg-row{grid-template-columns:1fr}.mg-row.flag::before{position:static;transform:none;justify-self:start}}
.gchip{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;text-align:left;color:var(--ink);min-width:0}
.gchip .num,.num{width:22px;height:22px;border-radius:7px;background:var(--blue-50);color:var(--blue);font-size:12px;display:grid;place-items:center;flex:none;font-weight:600}
.gchip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip:hover span.t{color:var(--blue)}
.trk-wrap{overflow-x:auto;padding-bottom:6px}
table.trk{border-collapse:separate;border-spacing:0;font-size:12px}
.trk th,.trk td{padding:0;text-align:center}
.trk thead th{font-weight:500;color:var(--mute);padding:2px 0 8px;min-width:27px;font-size:10.5px}
.trk thead th b{display:block;color:var(--ink);font-weight:600;font-size:12px;width:22px;height:20px;line-height:20px;margin:0 auto}
.trk thead th.we b{color:var(--blue)}
.trk thead th.today b{background:var(--blue);color:#fff;border-radius:6px}
.trk .hname{text-align:left;padding:5px 14px 5px 0;min-width:180px;max-width:220px;position:sticky;left:0;background:#fff;z-index:1}
.hname button{font-weight:600;font-size:13.5px;text-align:left;line-height:1.35}
.hname button:hover{color:var(--blue)}
.hname small{display:block;color:var(--mute);font-size:11.5px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk td.we{background:#f8f9fc}
.trk td.td{background:var(--blue-50)}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid #d5dae3;background:#fff;margin:3px auto;display:block;transition:.12s}
.ck:hover{border-color:var(--blue)}

function centerCell(el){

  el.style.fontSize='';

  MEAS.style.width=(el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight))+'px';

  MEAS.textContent=(el.value||el.placeholder||'')+'\u200b';
  MEAS.style.width=(el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-4)+'px';
  const H=el.clientHeight;let th;
  if(!empty){
    const real=()=>{el.style.paddingTop='0px';el.style.height='0px';const h=el.scrollHeight;el.style.height='';return h;};
    let fs=parseFloat(cs.fontSize);th=real();

}

function tracker(mk,gf){
  const mo=M(mk);const n=daysIn(mk);const y=+mk.slice(0,4),m=+mk.slice(5);
  const hs=mo.habits.filter(h=>gf==null||h.goal===gf);
  let head='<th class="hname"></th>';
  for(let d=1;d<=n;d++){const wd=new Date(y,m-1,d).getDay();head+=`<th class="${wd===0||wd===6?'we':''} ${`${mk}-${pad(d)}`===TODAYK?'today':''}">${WD[wd]}<b>${d}</b></th>`;}
  head+='<th class="rate" style="text-align:left">달성</th>';
  const rows=hs.map(h=>{const ch=mo.checks[h.id]||{};let tds='';for(let d=1;d<=n;d++){const wd=new Date(y,m-1,d).getDay();const dk=`${mk}-${pad(d)}`;tds+=`<td class="${dk===TODAYK?'td':(wd===0||wd===6?'we':'')}"><button class="ck ${ch[d]?'on':''}" data-act="ck" data-m="${mk}" data-h="${h.id}" data-d="${d}" aria-label="${d}일"></button></td>`;}
    const c=countChecks(mo,h.id),t=habitTarget(mk,h),pct=Math.min(100,Math.round(c/t*100));
    return `<tr><th class="hname"><button data-act="edit-habit" data-m="${mk}" data-h="${h.id}" title="수정">${esc(h.name)}</button><small>${isYH(h.id)?'연간 · ':''}${esc(h.goal!=null&&gTitle(h.goal)?gTitle(h.goal):'연결된 목표 없음')} · 주 ${h.freq}회</small></th>${tds}<td class="rate"><span>${c} / ${t}회</span><div class="bar"><i style="width:${pct}%"></i></div></td></tr>`;}).join('');
  const prev=MONTHS[MONTHS.indexOf(mk)-1];const prevHs=prev&&S.months[prev]?S.months[prev].habits.filter(h=>gf==null||h.goal===gf):[];
  const canCopy=prevHs.filter(h=>!mo.habits.some(x=>x.id===h.id)).length;
  const missY=S.core.yh.filter(y=>(y.st||'building')!=='paused'&&!mo.habits.some(h=>h.id===y.id)&&(gf==null||y.goal===gf));
  const table=hs.length?`<div class="trk-wrap"><table class="trk"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="desc">아직 ${gf==null?'':'이 목표의 '}습관이 없어요. 처음 한 달은 2~3개면 충분해요.</p>`;
  return `${table}
  ${canCopy||missY.length?`<div class="row" style="margin-top:8px">${canCopy?`<button class="btn sm" data-act="copy-prev" data-m="${mk}" data-gf="${gf??''}">지난달 습관 ${canCopy}개 이어서 가져오기</button>`:''}${missY.length?`<button class="btn sm" data-act="yh-fill" data-m="${mk}" data-gf="${gf??''}">연간 습관 ${missY.length}개 넣기</button>`:''}</div>`:''}
  <div class="add-habit ${gf==null?'':'nogoal'}"><input class="f" id="nhName" placeholder="새 습관 — 예) 아침 스트레칭 10분 (작고 구체적으로)" maxlength="40">${gf==null?`<select class="f" id="nhGoal">${goalOptions('')}</select>`:''}<select class="f" id="nhFreq">${freqOptions(3)}</select><button class="btn primary" data-act="add-habit" data-m="${mk}" data-gf="${gf??''}">추가</button></div>
  ${mo.habits.length>5?`<div class="hint"><div><b>이번 달 습관이 ${mo.habits.length}개예요.</b> 지치지 않으려면 꼭 필요한 3~4개만 남기는 것도 좋은 선택이에요.</div></div>`:''}`;
}

function layoutLanes(items){
  items.sort((x,y)=>x.s0-y.s0||y.e0-x.e0);let cluster=[],lanes=[],cEnd=-1;
  const flush=()=>{cluster.forEach(it=>it.n=lanes.length);cluster=[];lanes=[];};
  items.forEach(it=>{if(it.s0>=cEnd&&cluster.length)flush();let li=lanes.findIndex(e=>e<=it.s0);if(li<0){li=lanes.length;lanes.push(it.e0);}else lanes[li]=it.e0;it.lane=li;cluster.push(it);cEnd=Math.max(cEnd,it.e0);});
  flush();return items;
}

const NTH=['첫째','둘째','셋째','넷째','다섯째'];
function dayMatch(r,d){const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const dd=d.getDate();

  if(r.mode==='last')return dowMon(d)===r.wd&&dd+7>dim;
  return Math.min(r.md||1,dim)===dd;}
function ruleHit(r,from,dk){const n=Math.max(1,+r.n||1);const a=parseD(from),d=parseD(dk);

  if(r.f==='w'){if(!(r.days||[]).includes(dowMon(d)))return false;return Math.round(diffDays(dKey(mondayOf(a)),dKey(mondayOf(d)))/7)%n===0;}
  if(r.f==='m'){if(((d.getFullYear()-a.getFullYear())*12+d.getMonth()-a.getMonth())%n!==0)return false;return dayMatch(r,d);}
  if(r.f==='y'){if(d.getMonth()!==r.mon||(d.getFullYear()-a.getFullYear())%n!==0)return false;return dayMatch(r,d);}
  return false;}
const LASTC=new Map();
function lastOcc(b){const key=b.id+JSON.stringify(b.r)+(b.from||'');if(LASTC.has(key))return LASTC.get(key);let k=b.from||'2026-01-01',c=0,res=null;for(let i=0;i<7400;i++){if(ruleHit(b.r,b.from||'2026-01-01',k)){c++;if(c>=b.r.cnt){res=k;break;}}k=addDays(k,1);}LASTC.set(key,res);return res;}
function occurs(b,dk){const r=b.r;if(!r)return false;const from=b.from||'2026-01-01';if(dk<from)return false;if(r.end==='until'&&b.until&&dk>b.until)return false;
  if(!ruleHit(r,from,dk))return false;if(r.end==='count'&&r.cnt){const l=lastOcc(b);if(l&&dk>l)return false;}return !(b.ex||[]).includes(dk);}

function dayLbl(r){return r.mode==='nth'?`${NTH[(r.nth||1)-1]} ${WDM[r.wd]}요일`:r.mode==='last'?`마지막 ${WDM[r.wd]}요일`:`${r.md}일`;}
function ruleText(r,until){if(!r)return '';const n=Math.max(1,+r.n||1);let t='';

  return t;}

/* ---------- impacts & history ---------- */
function locLabel(gi,ii,before){if(gi<0)return '핵심 목표';if(ii<0)return `세부 목표 ${gNum(gi)}`;return `${gTitle(gi)||'세부 목표 '+gNum(gi)} · 실천 ${ii+1}`;}
function impacts(gi,ii){
  const up=[],past=[];const push=(m,o)=>(m<NOWM?past:up).push(o);
  if(gi<0){
    up.push({label:'만다라트 · 8개 세부 목표가 새 방향과 맞는지',go:{tab:'mandalart'}});
    goalsFilled().forEach(({g,i})=>up.push({label:`목표별 보기 · ${g.title}`,go:{tab:'exec',exec:'goal',goal:i}}));
    up.push({label:`${mLabelLong(NOWM)} 테마`,go:{tab:'exec',exec:'month',month:NOWM}});
    return {up,past};
  }
  if(ii<0){up.push({label:`만다라트 · 세부 목표 ${gNum(gi)} 블록의 실천 항목`,go:{tab:'mandalart'}});up.push({label:`목표별 보기 · 세부 목표 ${gNum(gi)}의 ‘중요한 이유’`,go:{tab:'exec',exec:'goal',goal:gi}});}
  MONTHS.forEach(m=>{const mo=S.months[m];if(!mo)return;const x=mo.goals['g'+gi];
    if(ii<0&&x&&x.target&&x.target.trim())push(m,{label:`${mLabelLong(m)} 월별 목표 — “${x.target}”`,go:{tab:'exec',exec:'month',month:m,goal:gi}});
    mo.habits.forEach(h=>{if(h.goal===gi&&(ii<0||h.src===ii))push(m,{label:`${mLabelLong(m)} 습관 — ${h.name}`,go:{tab:'exec',exec:'month',month:m,goal:gi}});});
  });
  return {up,past};
}
function kindOf(gi,ii){return gi<0?'center':(ii<0?'goal':'item');}

function freeSlots(dk,durs){
  const busy=[];blocksOn(dk).forEach(b=>busy.push([toMin(b.s),toMin(b.e)]));evsOn(dk).forEach(x=>{const e=x.e;if(e.tm&&x.dk===dk){const s0=toMin(e.tm);let e0=e.te?toMin(e.te):s0+60;if(e0<=s0)e0=s0+60;busy.push([s0,e0]);}});
  (TD(dk)||{tasks:[]}).tasks.forEach(t=>{if(t.tm){const s0=toMin(t.tm);busy.push([s0,t.te?toMin(t.te):s0+60]);}});
  busy.sort((a,b)=>a[0]-b[0]);const lo=7*60,hi=23*60;const gaps=[];let cur=lo;
  busy.forEach(([a,b])=>{if(b<=cur)return;if(a>cur)gaps.push([cur,Math.min(a,hi)]);cur=Math.max(cur,b);});if(cur<hi)gaps.push([cur,hi]);
  const g=gaps.map(([a,b])=>[Math.ceil(a/30)*30,b]).filter(([a,b])=>b>a).sort((x,y)=>(y[1]-y[0])-(x[1]-x[0]));
  const tot=durs.reduce((a,b)=>a+b,0);const fit=g.filter(([a,b])=>b-a>=tot).sort((x,y)=>x[0]-y[0])[0];let m=fit?fit[0]:g.length?g[0][0]:lo;
  return durs.map(d=>{const r=Math.min(m,24*60-d);m+=d;return r;});}

function tdFind(dk,id){const d=TD(dk,true);return d.tasks.find(t=>t.id===id);}
const BKDAYS=14;
function backlog(dk){const out=[];for(let i=1;i<=BKDAYS;i++){const k=addDays(dk,-i);const d=TD(k);if(!d||!Array.isArray(d.tasks))continue;d.tasks.forEach(t=>{if(!t.done&&!t.carried&&!t.drop&&(t.t||'').trim())out.push({dk:k,t,age:i});});}return out;}
function bkMove(from,id,to){const src=TD(from,true);const x=src.tasks.find(z=>z.id===id);if(!x)return 0;const d=TD(to,true);src.tasks=src.tasks.filter(z=>z!==x);renumPri(src);tdDirty(from);
  const nm=(x.t||'').trim();if(d.tasks.some(z=>(z.t||'').trim()===nm&&!z.done)){tdDirty(to);return 2;}unsched(x);x.pri=0;delete x.carried;x.from=x.from||from;d.tasks.push(x);tdDirty(to);return 1;}
function tdAdd(text){const dk=UI.tdd||TODAYK;const d=TD(dk,true);const nt0={id:uid(),t:text,done:false,pri:0,sub:[],open:false};if(UI.tdur)nt0.dur=UI.tdur;d.tasks.push(nt0);const ti=$('#tdNew');if(ti)ti.value='';tdDirty(dk);render(true);setTimeout(()=>{const x=$('#tdNew');x&&x.focus();},0);}
